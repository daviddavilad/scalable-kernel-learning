[project]
name = "skl"
version = "0.1.0"
description = "Effective dimension as a computational budget for approximate kernel learning"
readme = "README.md"
authors = [
    { name = "David Davila", email = "daviddavilacorraliza@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
